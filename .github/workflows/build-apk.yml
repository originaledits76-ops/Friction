name: Build Production APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 1: Ensure Gradle wrapper exists (Generates gradlew if missing from repo)
      - name: Bootstrap Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found, initializing Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      # Step 2: Generate a Keystore on the fly inside the runner
      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias release_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MySecurePassword123 \
            -keypass MySecurePassword123 \
            -dname "CN=Android App, OU=Dev, O=Company, L=City, S=State, C=US"

      # Step 3: Build Unsigned Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # Step 4: Locate, Align, and Sign the generated APK
      - name: Sign Release APK
        run: |
          # Find the built unsigned release APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found unsigned APK at: $UNSIGNED_APK"
          
          # Find Android SDK Build Tools (zipalign & apksigner)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # Zipalign the APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          
          # Sign the APK with the generated keystore
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:MySecurePassword123 \
            --key-pass pass:MySecurePassword123 \
            --ks-key-alias release_alias \
            --out production-app-release.apk \
            app-release-aligned.apk

      # Step 5: Upload signed production APK as an artifact
      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Production-Release-APK
          path: production-app-release.apk
