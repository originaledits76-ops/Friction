name: Build Production APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Ensures wrapper exists and HAS executable permissions
      - name: Bootstrap Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found, initializing Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      # Generates release key inside runner
      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias release_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass MySecurePassword123 \
            -keypass MySecurePassword123 \
            -dname "CN=Android App, OU=Dev, O=Company, L=City, S=State, C=US"

      # Build APK using installed JDK directly instead of searching for external toolchain
      - name: Build Release APK
        run: ./gradlew assembleRelease -Dorg.gradle.java.installations.auto-detect=false --stacktrace

      # Align & Sign APK
      - name: Sign Release APK
        run: |
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found unsigned APK at: $UNSIGNED_APK"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:MySecurePassword123 \
            --key-pass pass:MySecurePassword123 \
            --ks-key-alias release_alias \
            --out production-app-release.apk \
            app-release-aligned.apk

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Production-Release-APK
          path: production-app-release.apk
